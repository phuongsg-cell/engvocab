<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Practice & Vocab App</title>
  <!-- Google API & GIS SDKs -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: #e2e8f0;
      border-radius: 8px;
    }
    .status-indicator {
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .online { color: var(--success); }
    .offline { color: var(--danger); }
    
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    
    .vocab-item {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📚 English Learning & Vocab Sync</h1>
  </div>

  <!-- BẢNG TRẠNG THÁI KẾT NỐI -->
  <div class="status-bar">
    <div id="status" class="status-indicator offline">🔴 Chưa kết nối Google Drive</div>
    <button id="auth-btn" onclick="handleAuthClick()">Đăng nhập Google Drive</button>
  </div>

  <!-- FORM THÊM TỪ MỚI -->
  <div class="card">
    <h3>➕ Thêm từ vựng mới</h3>
    <input type="text" id="new-word" placeholder="Từ mới (e.g., Prescription)">
    <input type="text" id="new-meaning" placeholder="Nghĩa / Ghi chú (e.g., Đơn thuốc)">
    <button id="add-btn" onclick="addWord()" disabled>Lưu vào Google Drive & Cập nhật</button>
  </div>

  <!-- DANH SÁCH TỪ VỰNG -->
  <div class="card">
    <h3>📖 Danh sách từ vựng từ Drive</h3>
    <div id="vocab-list">Đang tải dữ liệu...</div>
  </div>

  <script>
    // Cấu hình Google Client ID & File Target
    const CLIENT_ID = '77360573208-rvps7dsakd2qbg6rvnoaa5927gijhaeb.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    const FILE_NAME = 'eng_vocab_data.json';

    let tokenClient;
    let accessToken = null;
    let driveFileId = null;
    let vocabData = [];

    // Khởi tạo ứng dụng
    window.onload = () => {
      initGapi();
      initGis();
    };

    function initGapi() {
      gapi.load('client', async () => {
        await gapi.client.init({});
        await gapi.client.load('https://www.googleapis.com/discovery/v1/apis/drive/v3/rest');
        restoreSession(); // Kiểm tra phiên làm việc đã lưu trên iPad/Trình duyệt
      });
    }

    function initGis() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (resp) => {
          if (resp.error) {
            console.error('Lỗi xác thực:', resp);
            return;
          }
          // Lưu token và thời gian hết hạn vào localStorage để không bị mất khi reload
          accessToken = resp.access_token;
          const expiresIn = resp.expires_in || 3600;
          const expiresAt = Date.now() + expiresIn * 1000;

          localStorage.setItem('gdrive_token', accessToken);
          localStorage.setItem('gdrive_expires_at', expiresAt);

          onAuthenticated();
        },
      });
    }

    // Tự động khôi phục kết nối khi Reload trang (F5) hoặc mở lại tab trên iPad
    function restoreSession() {
      const savedToken = localStorage.getItem('gdrive_token');
      const expiresAt = localStorage.getItem('gdrive_expires_at');

      if (savedToken && expiresAt && Date.now() < parseInt(expiresAt, 10)) {
        accessToken = savedToken;
        gapi.client.setToken({ access_token: accessToken });
        onAuthenticated();
      } else {
        clearSession();
      }
    }

    function clearSession() {
      accessToken = null;
      localStorage.removeItem('gdrive_token');
      localStorage.removeItem('gdrive_expires_at');
      updateStatus(false);
    }

    function handleAuthClick() {
      if (accessToken) {
        clearSession();
      } else {
        tokenClient.requestAccessToken({ prompt: '' }); // Silent refresh nếu có thể
      }
    }

    async function onAuthenticated() {
      gapi.client.setToken({ access_token: accessToken });
      updateStatus(true);
      await syncFromDrive();
    }

    function updateStatus(isOnline) {
      const statusEl = document.getElementById('status');
      const authBtn = document.getElementById('auth-btn');
      const addBtn = document.getElementById('add-btn');

      if (isOnline) {
        statusEl.className = 'status-indicator online';
        statusEl.innerHTML = '🟢 Đã duy trì kết nối Drive';
        authBtn.innerText = 'Đăng xuất';
        addBtn.disabled = false;
      } else {
        statusEl.className = 'status-indicator offline';
        statusEl.innerHTML = '🔴 Chưa kết nối Google Drive';
        authBtn.innerText = 'Đăng nhập Google Drive';
        addBtn.disabled = true;
      }
    }

    // -------------------------------------------------------------
    // LOGIC ĐỒNG BỘ DỮ LIỆU DRIVE (XỬ LÝ ĐỒNG THỜI WRITE & LOAD UI)
    // -------------------------------------------------------------

    // 1. Tải danh sách từ Drive
    async function syncFromDrive() {
      try {
        const res = await gapi.client.drive.files.list({
          q: `name='${FILE_NAME}' and trashed=false`,
          fields: 'files(id, name)',
        });

        const files = res.result.files;
        if (files && files.length > 0) {
          driveFileId = files[0].id;
          const fileRes = await gapi.client.drive.files.get({
            fileId: driveFileId,
            alt: 'media',
          });
          vocabData = Array.isArray(fileRes.result) ? fileRes.result : (fileRes.body ? JSON.parse(fileRes.body) : []);
        } else {
          // Tạo file mới nếu chưa có
          driveFileId = await createNewDriveFile([]);
          vocabData = [];
        }
        renderVocabList();
      } catch (err) {
        console.error('Lỗi khi tải từ Drive:', err);
        if (err.status === 401) {
          clearSession(); // Token hết hạn -> Yêu cầu auth lại
        }
      }
    }

    // 2. Thêm từ mới: Đẩy trực tiếp lên Google Drive và Cập nhật giao diện ngay lập tức
    async function addWord() {
      const wordInput = document.getElementById('new-word');
      const meaningInput = document.getElementById('new-meaning');

      const word = wordInput.value.trim();
      const meaning = meaningInput.value.trim();

      if (!word || !meaning) {
        alert('Vui lòng nhập đầy đủ từ và nghĩa!');
        return;
      }

      const newItem = { id: Date.now(), word, meaning, createdAt: new Date().toISOString() };
      
      // Thêm tạm vào mảng dữ liệu local
      vocabData.unshift(newItem);

      // Disable nút bấm trong lúc đang lưu
      const addBtn = document.getElementById('add-btn');
      addBtn.disabled = true;
      addBtn.innerText = 'Đang lưu lên Drive...';

      try {
        // Lưu dữ liệu cập nhật trực tiếp lên Drive
        await updateDriveFile(vocabData);

        // Reset input form
        wordInput.value = '';
        meaningInput.value = '';

        // Tải/Cập nhật ngay lập tức giao diện UI
        renderVocabList();
      } catch (err) {
        alert('Lỗi lưu dữ liệu lên Drive: ' + err.message);
        vocabData.shift(); // Revert nếu lưu không thành công
      } finally {
        addBtn.disabled = false;
        addBtn.innerText = 'Lưu vào Google Drive & Cập nhật';
      }
    }

    // 3. Render dữ liệu ra giao diện HTML
    function renderVocabList() {
      const listEl = document.getElementById('vocab-list');
      if (vocabData.length === 0) {
        listEl.innerHTML = '<p>Chưa có từ vựng nào trong Google Drive.</p>';
        return;
      }

      listEl.innerHTML = vocabData
        .map(
          (item) => `
          <div class="vocab-item">
            <div><strong>${escapeHtml(item.word)}</strong>: ${escapeHtml(item.meaning)}</div>
          </div>
        `
        )
        .join('');
    }

    // Các hàm Helper hỗ trợ Google Drive REST API
    async function createNewDriveFile(content) {
      const metadata = {
        name: FILE_NAME,
        mimeType: 'application/json',
      };
      const res = await gapi.client.drive.files.create({
        resource: metadata,
        fields: 'id',
      });
      const fileId = res.result.id;
      await updateDriveFile(content, fileId);
      return fileId;
    }

    async function updateDriveFile(content, fileId = driveFileId) {
      return fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: {
          Authorization: `Bearer ${accessToken}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(content),
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
